<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e65100">
<title>Camino 2026</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root{--bg:#faf7f0;--ink:#2b2b2b;--accent:#e65100;}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  body{display:flex;flex-direction:column;height:100dvh;}
  header{display:flex;align-items:center;gap:10px;background:var(--accent);color:#fff;
    padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));}
  header img{width:28px;height:28px;border-radius:6px}
  header h1{font-size:1.05rem;margin:0;font-weight:700;}
  .install{margin-left:auto;background:#fff;color:var(--accent);border:0;border-radius:8px;
    padding:7px 12px;font-weight:700;font-size:.85rem;cursor:pointer;display:none;}
  main{flex:1;min-height:0;}
  iframe{width:100%;height:100%;border:0;display:block;}
</style>
</head>
<body>
<header>
  <img src="icon.svg" alt="">
  <h1>Camino Português da Costa 2026</h1>
  <button class="install" id="installBtn">Installér</button>
</header>

<main>
  <iframe src="Kort%20-%20dag%20for%20dag.html" title="Kort dag for dag"></iframe>
</main>

<script>
// PWA install-knap
var deferredPrompt=null;
window.addEventListener("beforeinstallprompt", function(e){
  e.preventDefault(); deferredPrompt=e;
  var b=document.getElementById("installBtn"); b.style.display="inline-block";
  b.onclick=function(){ b.style.display="none"; deferredPrompt.prompt(); deferredPrompt=null; };
});

// Service worker (offline)
if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
</body>
</html>
