<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Camino-blå baggrund -->
  <rect width="512" height="512" rx="96" fill="#1565c0"/>

  <!-- Den ikoniske Camino-muslingeskal (vieira), gul -->
  <g>
    <!-- Skallens krop med lobet (skarnet) overkant -->
    <path d="M256 320
             L74 288
             Q87 223 153 197
             Q189 137 256 160
             Q323 137 359 197
             Q425 223 438 288
             Z"
          fill="#ffd54a" stroke="#0d47a1" stroke-width="7" stroke-linejoin="round"/>
    <!-- Ribber der stråler ud fra hængslet -->
    <g stroke="#0d47a1" stroke-width="7" stroke-linecap="round" fill="none">
      <line x1="256" y1="320" x2="74"  y2="288"/>
      <line x1="256" y1="320" x2="100" y2="233"/>
      <line x1="256" y1="320" x2="153" y2="197"/>
      <line x1="256" y1="320" x2="197" y2="158"/>
      <line x1="256" y1="320" x2="256" y2="160"/>
      <line x1="256" y1="320" x2="315" y2="158"/>
      <line x1="256" y1="320" x2="359" y2="197"/>
      <line x1="256" y1="320" x2="412" y2="233"/>
      <line x1="256" y1="320" x2="438" y2="288"/>
    </g>
  </g>

  <!-- Bånd med navnet -->
  <g>
    <rect x="76" y="322" width="360" height="66" rx="16" fill="#0d47a1" stroke="#ffd54a" stroke-width="5"/>
    <text x="256" y="367"
          text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="44" font-weight="700" fill="#ffffff" letter-spacing="0.5">Engmussen</text>
  </g>
</svg>
